
services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: neuromorphic-ops-backend

    command:
      [
        "uvicorn",
        "backend.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000"
      ]

    ports:
      - "8000:8000"

    volumes:
      - ./models:/app/models
      - ./outputs:/app/outputs
      - ./reports:/app/reports
      - ./runs:/app/runs
      - tracking_data:/app/outputs/tracking
      - tensorboard_data:/app/outputs/tensorboard
      - reports_data:/app/reports

    environment:
      PYTHONUNBUFFERED: "1"
      LANGGRAPH_STRICT_MSGPACK: "true"

    restart: unless-stopped


  frontend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: neuromorphic-ops-frontend

    command:
      [
        "streamlit",
        "run",
        "frontend/streamlit_app.py",
        "--server.address=0.0.0.0",
        "--server.port=8501"
      ]

    ports:
      - "8501:8501"

    depends_on:
      - backend

    environment:
      API_URL: "http://backend:8000"
      PYTHONUNBUFFERED: "1"

    volumes:
      - ./models:/app/models
      - ./outputs:/app/outputs
      - ./reports:/app/reports
      - ./runs:/app/runs
      - tracking_data:/app/outputs/tracking
      - tensorboard_data:/app/outputs/tensorboard
      - reports_data:/app/reports

    restart: unless-stopped


volumes:
  tracking_data:
  tensorboard_data:
  reports_data:

